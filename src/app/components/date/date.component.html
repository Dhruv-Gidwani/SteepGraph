<label for="icondisplay" class="block mb-1 font-medium " [ngClass]="{ 'text-red-500': showError }">{{ label }} </label>
<p-datepicker [(ngModel)]="date" [iconDisplay]="'input'" [showIcon]="true" inputId="icondisplay" [minDate]="minDate"
    (ngModelChange)="onSDateChange($event)" [ngClass]="{ 'datepicker-error': showError }" [showButtonBar]="true" class="w-full" />
