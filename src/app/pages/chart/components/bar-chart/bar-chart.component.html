<div
    class="card flex flex-col relative"
    [ngClass]="{
        'h-[420px]': !(isExpanded && expandedComponent === 'bar'),
        'h-full': isExpanded && expandedComponent === 'bar'
    }"
>
    <!-- Header with expand button -->
    <div class="flex justify-between items-center mb-4 px-2 relative">
        <div class="font-semibold text-xl text-center w-full">Resources in {{ selectedProject }}</div>
        <button
            class="absolute top-2 right-2 text-gray-600 hover:text-black z-10"
            pButton
            [icon]="isExpanded && expandedComponent === 'bar' ? 'pi pi-times' : 'pi pi-expand'"
            [pTooltip]="isExpanded && expandedComponent === 'bar' ? 'Collapse View' : 'Expand View'"
            tooltipPosition="top"
            (click)="toggleExpand.emit('bar')"
            styleClass="p-button-text p-0"
        ></button>
    </div>

    <div class="flex justify-between items-center px-4 py-2">
        <span class="text-sm text-gray-600"> Showing {{ displayedResourceCount }} of {{ totalResourceCount }} resources </span>
        <div class="flex gap-2">
            <button pButton [disabled]="currentPage === 0" icon="pi pi-chevron-left" (click)="previousPage()" pTooltip="Previous Page" class="p-button-text"></button>
            <span class="text-sm text-gray-600"> Page {{ currentPage + 1 }} of {{ totalPages }} </span>
            <button pButton [disabled]="currentPage === totalPages - 1" icon="pi pi-chevron-right" (click)="nextPage()" pTooltip="Next Page" class="p-button-text"></button>
        </div>
    </div>

    <!-- Combined Filters + Chart wrapper -->
    <div class="flex flex-col px-2 gap-4 flex-grow">
        <!-- Filters section -->
        <div class="grid grid-cols-2 gap-4">
            <div>
                <label class="block mb-1 font-medium">Filter by Role</label>
                <select [ngModel]="selectedRole" (ngModelChange)="onRoleChange($event)" class="w-full border p-1 rounded">
                    <option value="">All</option>
                    <option *ngFor="let role of availableRoles" [value]="role">{{ role }}</option>
                </select>
            </div>
            <div>
                <label class="block mb-1 font-medium">Billing Status</label>
                <select [ngModel]="selectedBillingStatus" (ngModelChange)="onBillingStatusChange($event)" class="w-full border p-1 rounded">
                    <option value="">All</option>
                    <option *ngFor="let status of uniqueBillingStatuses" [value]="status">{{ status }}</option>
                </select>
            </div>
        </div>

        <!-- Bar chart container: matches filter width -->
        <div class="w-full h-full">
            <p-chart type="bar" [data]="barChartData" [options]="barChartOptions" style="width: 100%; height: 100%"></p-chart>
        </div>
    </div>
</div>
