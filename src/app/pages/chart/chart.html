<app-loader *ngIf="isLoading"></app-loader>
<div class="p-0" *ngIf="!isLoading">
    <!-- Filters -->
    <div *ngIf="!isExpanded" class="mb-4 grid grid-cols-1 md:grid-cols-5 gap-2">
        <div>
            <multi-select-basic-demo *ngIf="statusoptionswc.length" [options]="statusoptionswc" [isDisabled]="true" [(selectedValue)]="filters.status" label="Status"></multi-select-basic-demo>
        </div>
        <div>
            <multi-select-basic-demo *ngIf="geographyOptionswc.length" [options]="geographyOptionswc" [(selectedValue)]="filters.geography" (selectedValueChange)="onGeographyChange($event)" label="Geography"> </multi-select-basic-demo>
        </div>
        <div>
            <multi-select-basic-demo *ngIf="billingMethodOptionswc.length" [options]="billingMethodOptionswc" [(selectedValue)]="filters.billingMethod" (selectedValueChange)="onBillingMethodChange($event)" label="Billing Method">
            </multi-select-basic-demo>
        </div>
        <div>
            <multi-select-basic-demo *ngIf="projectDistributionwc.length" [options]="projectDistributionwc" [(selectedValue)]="filters.project" label="Project"> </multi-select-basic-demo>
        </div>
        <div class="flex items-end gap-1">
            <p-button (click)="applyFilters()" label="Apply" class="w-full md:w-auto"></p-button>
            <p-button (click)="resetFilters()" label="Reset" class="w-full md:w-auto"></p-button>
        </div>
    </div>

    <div *ngIf="expandedComponent === 'pie'" class="fixed top-0 left-0 w-screen h-screen z-[9999] bg-white p-4 overflow-auto">
        <app-pie-chart
            [contracts]="filteredContracts"
            [selectedProject]="selectedProject"
            [selectedProjectIndex]="selectedProjectIndex"
            [displayedProjects]="displayedProjects"
            [isExpanded]="isExpanded"
            [expandedComponent]="expandedComponent"
            (projectSelected)="onProjectClick($event)"
            (toggleExpand)="toggleExpand($event)"
        ></app-pie-chart>
    </div>
    <div *ngIf="expandedComponent === 'bar'" class="fixed top-0 left-0 w-screen h-screen z-[9999] bg-white p-4 overflow-auto">
        <app-bar-chart
            [contracts]="selectedProjectData"
            [selectedProject]="selectedProject"
            [availableRoles]="availableRoles"
            [uniqueBillingStatuses]="uniqueBillingStatuses"
            [selectedRole]="selectedRole"
            [selectedBillingStatus]="selectedBillingStatus"
            [isExpanded]="isExpanded"
            [expandedComponent]="expandedComponent"
            (roleChanged)="onRoleChanged($event)"
            (billingStatusChanged)="onBillingStatusChanged($event)"
            (toggleExpand)="toggleExpand($event)"
        >
        </app-bar-chart>
    </div>
    <div *ngIf="!isExpanded" class="grid grid-cols-12 gap-8">
        <div class="col-span-12 xl:col-span-6 mb-4">
            <app-pie-chart
                [contracts]="filteredContracts"
                [selectedProject]="selectedProject"
                [selectedProjectIndex]="selectedProjectIndex"
                [displayedProjects]="displayedProjects"
                [isExpanded]="isExpanded"
                [expandedComponent]="expandedComponent"
                (projectSelected)="onProjectClick($event)"
                (toggleExpand)="toggleExpand($event)"
            ></app-pie-chart>
        </div>
        <div class="col-span-12 xl:col-span-6 mb-4" *ngIf="selectedProject">
            <app-bar-chart
                [contracts]="selectedProjectData"
                [selectedProject]="selectedProject"
                [availableRoles]="availableRoles"
                [uniqueBillingStatuses]="uniqueBillingStatuses"
                [selectedRole]="selectedRole"
                [selectedBillingStatus]="selectedBillingStatus"
                [isExpanded]="isExpanded"
                [expandedComponent]="expandedComponent"
                (roleChanged)="onRoleChanged($event)"
                (billingStatusChanged)="onBillingStatusChanged($event)"
                (toggleExpand)="toggleExpand($event)"
            >
            </app-bar-chart>
        </div>
    </div>

    <!-- Add expanded view for table -->
    <div *ngIf="expandedComponent === 'table'" class="fixed top-0 left-0 w-screen h-screen z-[9999] bg-white p-4 overflow-auto">
        <app-project-table [data]="selectedProjectData" [isExpanded]="isExpanded" [expandedComponent]="expandedComponent" (toggleExpand)="toggleExpand($event)"> </app-project-table>
    </div>

    <!-- Update the existing table in the normal view -->
    <div class="p-mt-4" *ngIf="selectedProjectData.length && !isExpanded">
        <app-project-table [data]="selectedProjectData" [isExpanded]="isExpanded" [expandedComponent]="expandedComponent" (toggleExpand)="toggleExpand($event)"> </app-project-table>
    </div>
</div>
