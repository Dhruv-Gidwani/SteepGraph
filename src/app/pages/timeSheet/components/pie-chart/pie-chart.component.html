<div
    class="card flex flex-col relative"
    [ngClass]="{
        'h-[420px]': !(isExpanded && expandedComponent === 'pie'),
        'h-full': isExpanded && expandedComponent === 'pie'
    }"
>
    <!-- Header -->
    <div class="flex justify-between items-center mb-4 px-2">
        <div class="font-semibold text-xl text-center w-full">Geography Distribution</div>
        <button
            class="absolute top-2 right-2 text-gray-600 hover:text-black z-10"
            pButton
            [icon]="isExpanded && expandedComponent === 'pie' ? 'pi pi-angle-down' : 'pi pi-angle-up'"
            [pTooltip]="isExpanded && expandedComponent === 'bar' ? 'Collapse View' : 'Expand View'"
            tooltipPosition="top"
            (click)="toggleExpand.emit('pie')"
            styleClass="p-button-text p-0"
        ></button>
    </div>

    <!-- Chart and List -->
    <div class="flex h-full overflow-hidden px-2">
        <div
            [ngClass]="{
                'w-[250px] h-[250px]': !(isExpanded && expandedComponent === 'pie'),
                'w-[500px] h-[500px]': isExpanded && expandedComponent === 'pie'
            }"
        >
            <p-chart type="pie" [data]="pieChartData" [options]="pieChartOptions"></p-chart>
        </div>

        <div
            class="flex-1 overflow-y-auto ml-4 pr-2 hide-scrollbar"
            [ngClass]="{
                'max-h-[350px]': !(isExpanded && expandedComponent === 'pie'),
                'max-h-full': isExpanded && expandedComponent === 'pie'
            }"
        >
            <ul class="geography-list">
                <li
                    *ngFor="let geography of displayedGeographies"
                    (click)="onGeographyClick(geography)"
                    [ngClass]="{
                        'bg-blue-100 text-blue-700 font-semibold': geography === firstGeography,
                        'hover:bg-gray-100 dark:hover:bg-surface-700': true
                    }"
                    class="cursor-pointer px-3 py-2 rounded-md transition-colors duration-200"
                >
                    {{ geography }}
                </li>
            </ul>
        </div>
    </div>
</div>
