<app-loader *ngIf="isLoading"></app-loader>
<div class="p-0" *ngIf="!isLoading">
    <!-- Filters -->
    <div class="mb-4 grid grid-cols-1 md:grid-cols-8 gap-2">
        <div>
            <label class="block mb-1 font-medium" [ngClass]="{ 'text-red-500': showStartDateError }">Start Date</label>
            <input type="date" [(ngModel)]="startDate" class="w-full border p-2 rounded ng-invalid ng-dirty"
                [ngClass]="{ 'border-red-500': showStartDateError }" (ngModelChange)="onDateChange('start')" />
            <!-- <div class="mt-1"><message-form-demo *ngIf="showStartDateError" type="error"
                    text="Date is required"></message-form-demo></div> -->
        </div>
        <div>
            <label class="block mb-1 font-medium" [ngClass]="{ 'text-red-500': showEndDateError }">End Date</label>
            <input type="date" [(ngModel)]="endDate" class="w-full border p-2 rounded ng-invalid ng-dirty"
                [ngClass]="{ 'border-red-500': showEndDateError }" (ngModelChange)="onDateChange('end')" />
            <!-- <div class="mt-1"><message-form-demo *ngIf="showEndDateError" type="error"
                    text="Date is required"></message-form-demo></div> -->
        </div>
        <div>

            <dropdown-filter-demo *ngIf="departmentOptions.length" [options]="departmentOptions"
                [(selectedValue)]="department" label="Department"></dropdown-filter-demo>
        </div>
        <div>

            <dropdown-filter-demo *ngIf="positionTitleOptions.length" [options]="positionTitleOptions"
                [(selectedValue)]="positionTitle" label="Position Title"></dropdown-filter-demo>
        </div>
        <div>
            <dropdown-filter-demo *ngIf="geographyOptions.length" [options]="geographyOptions"
                [(selectedValue)]="geography" label="Geography"></dropdown-filter-demo>
        </div>

        <div>
            <dropdown-filter-demo *ngIf="projectOptions.length" [options]="projectOptions" [(selectedValue)]="project"
                label="Project"></dropdown-filter-demo>
        </div>
        <div>
            <dropdown-filter-demo *ngIf="employeeOptions.length" [options]="employeeOptions"
                [(selectedValue)]="emp_name" label="Employee"></dropdown-filter-demo>
        </div>
        <div class="flex items-end">
            <button (click)="applyFilters()"
                class="bg-blue-500 text-white py-2 rounded hover:bg-blue-600 w-full mr-2">Apply Filters</button>
            <button (click)="resetFilters()" class="bg-blue-500 text-white py-2 rounded hover:bg-blue-600 w-full">Reset
                Filters</button>
        </div>

    </div>

    <!-- Chart Section -->
    <p-fluid class="grid grid-cols-12 gap-8">
        <!-- Pie Chart Area -->
        <div class="col-span-12 xl:col-span-6 mb-4" *ngIf="projectTableData.length">
            <app-pie-chart [data]="projectTableData" [selectedGeography]="selectedGeography"
                [selectedGeographyIndex]="selectedGeographyIndex" (geographyClick)="handleGeographyClick($event)">
            </app-pie-chart>
        </div>

        <!-- Bar Chart Area -->
        <div class="col-span-12 xl:col-span-6 mb-4" *ngIf="projectTableData.length">
            <app-bar-chart [data]="projectTableData" [selectedDepartment]="selectedDepartment"
                [selectedGeography]="selectedGeography" (departmentClick)="handleDepartmentClick($event)">
            </app-bar-chart>
        </div>
    </p-fluid>
    <!-- Data Table -->
    <div class="p-mt-4" *ngIf="projectTableData.length">
        <app-project-table *ngIf="projectTableData.length" [projectTableData]="projectTableData"
            [exportData]="exportData" />
    </div>
</div>
