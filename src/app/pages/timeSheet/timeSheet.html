<app-loader *ngIf="isLoading"></app-loader>
<div class="p-0" *ngIf="!isLoading">
    <!-- Filters -->
    <div class="mb-4 grid grid-cols-1 md:grid-cols-8 gap-2">
        <div>
            <label class="block mb-1 font-medium" [ngClass]="{ 'text-red-500': showStartDateError }">Start Date</label>
            <input type="date" [(ngModel)]="startDate" class="w-full border p-2 rounded ng-invalid ng-dirty"
                [ngClass]="{ 'border-red-500': showStartDateError }" (ngModelChange)="onDateChange('start')" />
            <!-- <div class="mt-1"><message-form-demo *ngIf="showStartDateError" type="error"
                    text="Date is required"></message-form-demo></div> -->
        </div>
        <div>
            <label class="block mb-1 font-medium" [ngClass]="{ 'text-red-500': showEndDateError }">End Date</label>
            <input type="date" [(ngModel)]="endDate" class="w-full border p-2 rounded ng-invalid ng-dirty"
                [ngClass]="{ 'border-red-500': showEndDateError }" (ngModelChange)="onDateChange('end')" />
            <!-- <div class="mt-1"><message-form-demo *ngIf="showEndDateError" type="error"
                    text="Date is required"></message-form-demo></div> -->
        </div>
        <div>
            <label class="block mb-1 font-medium">Department</label>
            <select [(ngModel)]="department" class="w-full border p-2 rounded">
                <option value="">All</option>
                <option *ngFor="let Department of DepartmentList" [value]="Department">{{ Department }}</option>

            </select>
        </div>
        <div>
            <label class="block mb-1 font-medium">Position Title</label>
            <select [(ngModel)]="positionTitle" class="w-full border p-2 rounded">
                <option value="">All</option>
                <option *ngFor="let role of rolesList" [value]="role">{{ role }}</option>
            </select>
        </div>
        <div>
            <label class="block mb-1 font-medium">Geography</label>
            <select [(ngModel)]="geography" class="w-full border p-2 rounded">
                <option value="">All</option>
                <option *ngFor="let Region of RegionList" [value]="Region">{{ Region }}</option>

            </select>
        </div>

        <div>
            <label class="block mb-1 font-medium">Project</label>
            <select [(ngModel)]="project" class="w-full border p-2 rounded">
                <option value="">All</option>
                <option *ngFor="let Project of ProjectList" [value]="Project">{{ Project }}</option>

            </select>
            <!-- <dropdown-filter-demo ></dropdown-filter-demo> -->
        </div>
        <div>
            <label class="block mb-1 font-medium">Employee</label>
            <select [(ngModel)]="emp_name" class="w-full border p-2 rounded">
                <option value="">All</option>
                <option *ngFor="let Employee of EmployeeList" [value]="Employee">{{ Employee }}</option>
            </select>
        </div>
        <!-- <div>
            <label class="block mb-1 font-medium invisible">Actions</label>
            <div class="flex items-end ">
                <button (click)="applyFilters()"
                    class="bg-blue-500 text-white  py-2 rounded hover:bg-blue-600 w-full mr-2">Apply Filters</button>
                <button (click)="resetFilters()"
                    class="bg-blue-500 text-white  py-2 rounded hover:bg-blue-600 w-full">Reset Filters</button>
            </div>
        </div> -->
         <div class="flex items-end">
            <button (click)="applyFilters()" class="bg-blue-500 text-white py-2 rounded hover:bg-blue-600 w-full mr-2">Apply Filters</button>
            <button (click)="resetFilters()" class="bg-blue-500 text-white py-2 rounded hover:bg-blue-600 w-full">Reset Filters</button>
        </div>

    </div>

        <!-- Chart Section -->
<p-fluid class="grid grid-cols-12 gap-8">
    <!-- Pie Chart Area -->
    <div class="col-span-12 xl:col-span-6 mb-6" *ngIf="projectTableData.length">
        <app-pie-chart 
            [data]="projectTableData" 
            [selectedGeography]="selectedGeography" 
            [selectedGeographyIndex]="selectedGeographyIndex"
            (geographyClick)="handleGeographyClick($event)">
        </app-pie-chart>
    </div>

    <!-- Bar Chart Area -->
    <div class="col-span-12 xl:col-span-6 mb-6" *ngIf="projectTableData.length">
        <app-bar-chart 
            [data]="projectTableData" 
            [selectedDepartment]="selectedDepartment" 
            [selectedGeography]="selectedGeography"
            (departmentClick)="handleDepartmentClick($event)">
        </app-bar-chart>
    </div>
</p-fluid>
        <!-- Data Table -->
        <div class="p-mt-4" *ngIf="projectTableData.length">
        <app-project-table
        *ngIf="projectTableData.length"
        [projectTableData]="projectTableData"
        
        [exportData]="exportData"
        />
        </div>
</div>
